name: Build and distribute PawHide
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # Temporary migration validation: regenerate the lock and capture
      # rustfmt-normalized sources in CI so they can be committed deliberately.
      # This runner-only step is removed after the new lockfile is committed.
      - name: Stage new capture dependencies and formatted sources
        shell: pwsh
        run: |
          cargo generate-lockfile
          cargo fmt --all
          $paths = @(
            'Cargo.lock',
            'cli/src/main.rs',
            'cli/src/commands.rs',
            'cli/src/presentation.rs',
            'cli/src/capture_preview.rs',
            'cli/src/capture_native.rs',
            'cli/src/auto.rs',
            'cli/src/startup.rs'
          )
          foreach ($p in $paths) {
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path (Get-Location) $p)))
            for ($i = 0; $i -lt $encoded.Length; $i += 1500) {
              $chunk = $encoded.Substring($i, [Math]::Min(1500, $encoded.Length - $i))
              Write-Host "PAWH_CHUNK|$p|$i|$chunk"
            }
          }
      - name: Validate, release-build and package with Cargo
        run: cargo all
      - uses: actions/upload-artifact@v4
        with:
          name: PawHide-Windows-x64
          path: |
            dist/PawHide-Windows-x64.zip
            dist/PawHide-Windows-x64.zip.sha256
            dist/PawHide-setup.exe
