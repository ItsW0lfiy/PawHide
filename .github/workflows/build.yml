name: Build and distribute PawHide
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install NSIS for cargo all packaging
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
      - name: Validate, release-build and package with Cargo
        run: cargo all
      - uses: actions/upload-artifact@v4
        with:
          name: PawHide-Windows-x64
          path: |
            dist/PawHide-Windows-x64.zip
            dist/PawHide-Windows-x64.zip.sha256
            dist/PawHide-setup.exe
