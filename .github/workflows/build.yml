name: Build and distribute PawHide
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Format CLI migration files in runner (temporary diagnostic)
        shell: pwsh
        run: |
          cargo fmt --all
          foreach ($path in @('cli/src/main.rs', 'cli/src/commands.rs', 'cli/src/auto.rs', 'xtask/src/main.rs')) {
            Write-Output "PAWHIDE_SOURCE_BEGIN:$path"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            for ($i = 0; $i -lt $encoded.Length; $i += 4096) {
              Write-Output $encoded.Substring($i, [Math]::Min(4096, $encoded.Length - $i))
            }
            Write-Output "PAWHIDE_SOURCE_END:$path"
          }
      - name: Validate, release-build and package with Cargo
        run: cargo all
      - uses: actions/upload-artifact@v4
        with:
          name: PawHide-Windows-x64
          path: |
            dist/PawHide-Windows-x64.zip
            dist/PawHide-Windows-x64.zip.sha256
            dist/PawHide-setup.exe
