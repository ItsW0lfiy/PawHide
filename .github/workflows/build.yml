name: Build and distribute PawHide
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Generate CLI-only lockfile for migration validation
        shell: pwsh
        run: |
          cargo metadata --format-version 1 | Out-Null
          Write-Output "PAWHIDE_LOCK_BEGIN"
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes("Cargo.lock"))
          for ($i = 0; $i -lt $encoded.Length; $i += 4096) {
            Write-Output $encoded.Substring($i, [Math]::Min(4096, $encoded.Length - $i))
          }
          Write-Output "PAWHIDE_LOCK_END"
      - name: Validate, release-build and package with Cargo
        run: cargo all
      - uses: actions/upload-artifact@v4
        with:
          name: PawHide-Windows-x64
          path: |
            dist/PawHide-Windows-x64.zip
            dist/PawHide-Windows-x64.zip.sha256
            dist/PawHide-setup.exe
