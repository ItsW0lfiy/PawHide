[package]
name = "pawhide-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "PawHideUI"
path = "src/main.rs"

[dependencies]
pawhide-core = { path = "../core" }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }


# Optional native capture-test page. Windows.Graphics.Capture / Direct3D 11,
# already part of the Windows API bindings; no FFmpeg dependency or sidecar.
windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture"
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
