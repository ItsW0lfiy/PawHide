[package]
name = "pawhide-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "PawHideUI"
path = "src/main.rs"

[dependencies]
pawhide-core = { path = "../core" }
# Native Slint/Winit frontend; no egui, WebView2 or browser engine.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18", "accessibility"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture"
] }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
