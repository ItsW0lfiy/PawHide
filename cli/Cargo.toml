[package]
name = "pawhide"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
pawhide-core = { path = "../core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Windows Graphics Capture supports the CLI-launched live preview.
windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture"
] }
